<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
	<title>Implementing ARIA Roles</title>
</head>

<body>
	<h1 role="heading">Learning the ARIA implementation</h1>
	<main>
		<nav role="navigation">
			<a id="nav-image" href="#image">image</a>
			<a id="nav-image" href="#list">list</a>
		</nav>
		<section role="Image and description">
			<img 
				alt="this is the image of a flower" 
				src="https://via.placeholder.com/200"
				role='img'
				>
		</section>
		<h2 id="skills">My Skills</h2>

    <ul role="list">
        <li role="listitem">HTML</li>
        <li role="listitem">CSS</li>
        <li role="listitem">JavaScript</li>
    </ul>

    <p id="contact">Contact me to learn more about my work!</p>
		
	</main>
	<!-- the entire body must be written by student -->
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
